{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="card">
  <h2>Sign Up Page</h2>
  <form class="body" method="post">
    {% include "_flash.html" %}
    <label for="name">Name</label>
    <input id="name" name="name" placeholder="Enter name" required>
    <label for="username">Username</label>
    <input id="username" name="username" placeholder="Enter username" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Enter password" required>
    <button class="btn" type="submit">Create Account</button>
    <a class="link" href="{{ url_for('login') }}">Already have an account? Login</a>
  </form>
</div>
{% endblock %}
